
name: SKAVEN Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skaven-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build SKAVEN APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Diagnose project files
        shell: bash
        run: |
          echo "Checking SKAVEN project structure..."

          FAILED=0

          for FILE in \
            pubspec.yaml \
            lib/main.dart \
            lib/services/recon_service.dart \
            android/app/src/main/AndroidManifest.xml
          do
            if [ -f "$FILE" ]; then
              echo "[OK] $FILE"
            else
              echo "[MISSING] $FILE"
              FAILED=1
            fi
          done

          echo ""
          echo "LIB DIRECTORY:"
          find lib -maxdepth 5 -type f 2>/dev/null || true

          echo ""
          echo "ANDROID DIRECTORY:"
          find android -maxdepth 5 -type f 2>/dev/null || true

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more required project files are missing."
            exit 1
          fi

          echo "All required project files are present."

      - name: Verify Flutter project
        run: |
          flutter --version
          flutter doctor -v
          flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK output
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          echo "SKAVEN APK generated successfully:"
          ls -lh "$APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SKAVEN-Android-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
