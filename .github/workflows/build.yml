
name: SKAVEN Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skaven-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build SKAVEN APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Dart project
        shell: bash
        run: |
          set -e

          for FILE in \
            pubspec.yaml \
            lib/main.dart \
            lib/services/recon_service.dart
          do
            if [ ! -f "$FILE" ]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi
            echo "[OK] $FILE"
          done

          flutter --version

      - name: Generate Android platform scaffold
        shell: bash
        run: |
          set -e

          flutter create \
            --no-pub \
            --platforms=android \
            --org com.anonymousbeta \
            --project-name skaven \
            /tmp/skaven_android_scaffold

          GENERATED_ANDROID="/tmp/skaven_android_scaffold/android"

          if [ ! -d "$GENERATED_ANDROID" ]; then
            echo "::error::Flutter did not generate Android platform files."
            exit 1
          fi

          rm -rf android
          cp -a "$GENERATED_ANDROID" ./android

          echo "Android scaffold generated."

          find android -maxdepth 8 -type f | sort

      - name: Configure Android manifest
        shell: bash
        run: |
          set -e

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:label="SKAVEN"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />

              </application>
          </manifest>
          EOF

      - name: Verify Android scaffold
        shell: bash
        run: |
          set -e

          FOUND_SETTINGS=false
          FOUND_APP_GRADLE=false
          FOUND_ACTIVITY=false

          if [ -f android/settings.gradle ] || [ -f android/settings.gradle.kts ]; then
            FOUND_SETTINGS=true
            echo "[OK] Gradle settings file"
          fi

          if [ -f android/app/build.gradle ] || [ -f android/app/build.gradle.kts ]; then
            FOUND_APP_GRADLE=true
            echo "[OK] App Gradle file"
          fi

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo "[OK] Gradle wrapper properties"
          else
            echo "::error::Gradle wrapper properties missing."
            exit 1
          fi

          if [ -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "[OK] Gradle wrapper JAR"
          else
            echo "::error::Gradle wrapper JAR missing."
            exit 1
          fi

          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            echo "[OK] Android manifest"
          else
            echo "::error::Android manifest missing."
            exit 1
          fi

          if find android/app/src/main -type f -name "MainActivity.kt" | grep -q .; then
            FOUND_ACTIVITY=true
            echo "[OK] Kotlin MainActivity found"
          elif find android/app/src/main -type f -name "MainActivity.java" | grep -q .; then
            FOUND_ACTIVITY=true
            echo "[OK] Java MainActivity found"
          fi

          if [ "$FOUND_SETTINGS" != true ]; then
            echo "::error::Gradle settings file missing."
            exit 1
          fi

          if [ "$FOUND_APP_GRADLE" != true ]; then
            echo "::error::App Gradle file missing."
            exit 1
          fi

          if [ "$FOUND_ACTIVITY" != true ]; then
            echo "::error::Android MainActivity missing."
            exit 1
          fi

          echo "Android scaffold verification passed."

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK output
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          echo "SKAVEN APK generated successfully:"
          ls -lh "$APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SKAVEN-Android-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
